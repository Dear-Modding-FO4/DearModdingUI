panelPadding = [12.0, 12.0]

[effects]
backgroundBlur = true
backgroundBlurStrength = 0.5
iconColorMode = "colored"  # "colored" or "monochrome"
logoColorMode = "original"  # "original" or "accent"

# baseFontRatio is body pixels per screen pixel of height. Each role sets
# family (a folder under Fonts, or "ImGui" for the built-in font), weight
# (thin to black, or 100 to 900), italic, and size (a multiple of the base).
[typography]
baseFontRatio = 0.019444445

[typography.body]
family = "Jost"
weight = "regular"
italic = false
size = 1.0

[typography.title]
family = "Jost"
weight = "semibold"
italic = false
size = 1.3

[typography.heading]
family = "Jost"
weight = "regular"
italic = false
size = 1.0

[typography.subheading]
family = "Jost"
weight = "regular"
italic = false
size = 1.0

[typography.subtext]
family = "Jost"
weight = "regular"
italic = false
size = 0.9

[typography.monospace]
family = "JetBrains Mono"
weight = "regular"
italic = false
size = 0.9

# font is a file under Fonts; empty keeps Phosphor. glyphs maps Phosphor icon
# names to codepoints in that font, for example: gear = 0xE001.
[icons]
font = ""
baselineOffsetRatio = 0.1904762

[icons.glyphs]
