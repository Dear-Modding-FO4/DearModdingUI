# Default theme preset: every supported key at the value the built-in look uses.
# A preset lists only what it changes; the rest comes from the built-in default.
#
# Colors are "#RRGGBB", "#RRGGBBAA", or [r, g, b, a] with channels from 0 to 1.
# Sizes are unscaled pixels at the 1080p reference; the host scales them to the
# screen. A key that fails validation is ignored and reported in Health.
# Accent-driven color slots follow [tokens] accent when a preset leaves them out.

[theme]
name = "Default"

