name: xmake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Initialize CommonLibF4 dependencies
      run: git -C Depends/commonlibf4 submodule update --init --recursive

    - name: Add MSVC to PATH
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Configure
      run: xmake config --yes

    - name: Build
      run: xmake build -P . -y

    - name: Check ImGui forwarding header
      shell: pwsh
      run: |
        $generated = Join-Path $env:RUNNER_TEMP 'ImGuiForward.h'
        $committed = 'Depends/commonlibf4/lib/dearmoddingui-api/include/DearModdingUI/ImGuiForward.h'
        $dll = '.Build/F4SE/Plugins/DearModdingUI.dll'

        python Tools/generate_imgui_forward.py `
          --definitions Depends/cimgui/generator/output/definitions.json `
          --allowlist Tools/imgui_forward_allowlist.json `
          --output $generated `
          --dll $dll
        if ($LASTEXITCODE -ne 0) {
          throw 'ImGui forwarding generation or DLL export validation failed.'
        }

        function Get-NormalizedBytes([string] $path) {
          $inputBytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
          $outputBytes = [IO.MemoryStream]::new()
          for ($index = 0; $index -lt $inputBytes.Length; $index++) {
            if ($inputBytes[$index] -eq 13) {
              $outputBytes.WriteByte(10)
              if ($index + 1 -lt $inputBytes.Length -and $inputBytes[$index + 1] -eq 10) {
                $index++
              }
            } else {
              $outputBytes.WriteByte($inputBytes[$index])
            }
          }
          return $outputBytes.ToArray()
        }

        [byte[]] $generatedBytes = Get-NormalizedBytes $generated
        [byte[]] $committedBytes = Get-NormalizedBytes $committed
        if (-not [Linq.Enumerable]::SequenceEqual[byte]($generatedBytes, $committedBytes)) {
          throw @'
        The committed ImGui forwarding header is out of date.
        From DearModdingUI, run:
          python Tools/generate_imgui_forward.py --definitions Depends/cimgui/generator/output/definitions.json --allowlist Tools/imgui_forward_allowlist.json --output Depends/commonlibf4/lib/dearmoddingui-api/include/DearModdingUI/ImGuiForward.h
        Commit include/DearModdingUI/ImGuiForward.h in the nested DearModdingUI-API checkout, then update the CommonLibF4 and DearModdingUI submodule references.
        '@
        }
        Write-Host 'ImGui forwarding header matches the generator and DLL exports.'

    - name: Check plugin exports
      shell: pwsh
      run: |
        $dll = '.Build/F4SE/Plugins/DearModdingUI.dll'
        if (-not (Test-Path $dll)) { throw "$dll was not produced" }

        $exports = (dumpbin /exports $dll) -join "`n"
        $missing = @('DMUI_GetHostAPI','F4SEPlugin_Load','F4SEPlugin_Query','F4SEPlugin_Version') |
          Where-Object { $exports -notmatch [regex]::Escape($_) }

        if ($missing) { throw "missing DearModdingUI exports: $($missing -join ', ')" }
        Write-Host "all four DearModdingUI exports present"

    - name: Run checks
      run: .Build/Tests/dmui-tests.exe

    - name: Upload build output
      uses: actions/upload-artifact@v6
      with:
        name: dearmoddingui-xmake-${{ github.sha }}
        path: |
          .Build/F4SE/Plugins/DearModdingUI.dll
          .Build/F4SE/Plugins/DearModdingUI.pdb
          .Build/F4SE/Plugins/DearModdingUI.toml
          .Build/F4SE/Plugins/DearModdingUI
